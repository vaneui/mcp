name: Test

# Builds the server and runs the tests on every pull request and on main,
# against the committed corpus in resources/.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# A new push to a pull request replaces the run in progress. Runs on main finish.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The tests are TypeScript files that Node 24 runs directly.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # Compiles src/, type-checks the repo and runs test/ against dist/.
      - name: Run Tests
        run: npm test
